annotations:
  category: Analytics
  licenses: Apache-2.0
  images: |
    - name: superset
      image: docker.io/apache/superset:6.1.0

apiVersion: v2
name: dashboard
description: >-
  Apache Superset 6 — web, Celery worker and beat — on the upstream lean image,
  with an external PostgreSQL/MySQL metastore, Valkey for caching and the Celery
  broker, database drivers for TimescaleDB/PostgreSQL and ClickHouse, optional
  .supx extensions, embedding and alerts & reports.
type: application
keywords:
  - superset
  - dashboards
  - analytics
  - bi

dependencies:
  - name: valkey
    version: "~0"
    repository: "https://valkey.io/valkey-helm"
    condition: valkey.enabled

# 0.2.0 replaces the Drupal + StackGres + upstream-superset-subchart chart with
# a Superset chart of its own. Not an in-place upgrade: every resource name
# changes, the Drupal StatefulSet and PVCs are gone, and the metastore is no
# longer created here — point `metastore` at an existing PostgreSQL (for
# example the timescaledb chart in this repository).
version: 0.2.0
appVersion: "6.1.0"

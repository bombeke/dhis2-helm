{{- $fullname := include "dashboard.fullname" . }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    # SECRET_KEY encrypts every database password stored in the metastore. If
    # this Secret were deleted by `helm uninstall` and regenerated on the next
    # install against the same metastore, every saved connection would become
    # undecryptable. Keeping it makes the pair survive together.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  secret-key: {{ include "dashboard.secretValue" (dict "ctx" $ "secret" $fullname "key" "secret-key" "value" .Values.auth.secretKey "length" 64) | b64enc | quote }}
  {{- with .Values.auth.previousSecretKey }}
  previous-secret-key: {{ . | b64enc | quote }}
  {{- end }}
  admin-password: {{ include "dashboard.secretValue" (dict "ctx" $ "secret" $fullname "key" "admin-password" "value" .Values.admin.password "length" 24) | b64enc | quote }}
  guest-token-jwt-secret: {{ include "dashboard.secretValue" (dict "ctx" $ "secret" $fullname "key" "guest-token-jwt-secret" "value" .Values.auth.guestTokenJwtSecret "length" 64) | b64enc | quote }}
  async-queries-jwt-secret: {{ include "dashboard.secretValue" (dict "ctx" $ "secret" $fullname "key" "async-queries-jwt-secret" "value" .Values.auth.asyncQueriesJwtSecret "length" 64) | b64enc | quote }}
{{- end }}
{{- if include "dashboard.hasCredentials" . }}
---
# Passwords for systems this chart does not own, given inline in values.
# Prefer each one's existingSecret: an inline password is also in the Helm
# release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-credentials
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if and .Values.metastore.password (not .Values.metastore.uriSecret.name) }}
  metastore-password: {{ .Values.metastore.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.alerts.enabled }}
  {{- with .Values.alerts.smtp.password }}
  smtp-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.alerts.slack.token }}
  slack-api-token: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if include "dashboard.createValkeySecret" . }}
{{- $valkeySecret := include "dashboard.valkeySecretName" . }}
---
# Read by BOTH this chart (as the client password) and the valkey subchart (as
# the `default` ACL user's password, through valkey.auth.usersExistingSecret),
# so the two can never disagree. The subchart mounts this whole Secret, which
# is why it holds nothing else.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $valkeySecret }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  valkey-password: {{ include "dashboard.secretValue" (dict "ctx" $ "secret" $valkeySecret "key" "valkey-password" "value" .Values.valkeyConnection.password "length" 48) | b64enc | quote }}
{{- end }}
{{- if .Values.configOverridesSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-overrides
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $name, $body := .Values.configOverridesSecret }}
  {{ $name }}.py: {{ $body | b64enc | quote }}
  {{- end }}
{{- end }}

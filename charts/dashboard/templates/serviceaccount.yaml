{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.serviceAccountName" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.serviceAccount.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in this chart calls the Kubernetes API; the pods also opt out
# individually.
automountServiceAccountToken: false
{{- end }}

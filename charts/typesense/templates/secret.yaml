{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "typesense.fullname" . }}
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
  annotations:
    # Every scoped key your application holds was derived from this one, and
    # regenerating it invalidates all of them. `helm uninstall` deleting the
    # Secret while the PVCs are retained is exactly how that happens by
    # accident.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  api-key: {{ include "typesense.apiKey" . | b64enc | quote }}
{{- end }}

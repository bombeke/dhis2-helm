apiVersion: v1
kind: Service
metadata:
  name: {{ include "typesense.fullname" . }}
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.service.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Only the API port. The peering port is never published here: Raft traffic
  # is unauthenticated and unencrypted, and a Service in front of it would let
  # anything in the cluster join the quorum.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "typesense.selectorLabels" . | nindent 4 }}
---
# Governing Service for the StatefulSet. It does two jobs here: it gives each
# pod a stable name (which is how the backup CronJob reaches one specific
# node), and its A record is the peer list the resolver reads.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "typesense.headlessName" . }}
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  # Load-bearing, not a convenience. A Typesense node is not Ready until it has
  # a quorum, and it cannot get a quorum until it can see its peers in this
  # record. Without this the cluster can never bootstrap: DNS would return
  # nothing until the nodes were healthy, and the nodes cannot become healthy
  # until DNS returns something.
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if include "typesense.clustered" . }}
    - name: peering
      port: {{ .Values.cluster.peeringPort }}
      targetPort: peering
      protocol: TCP
    {{- end }}
  selector:
    {{- include "typesense.selectorLabels" . | nindent 4 }}

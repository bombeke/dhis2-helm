{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "typesense.serviceAccountName" . }}
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in this chart calls the Kubernetes API — peer discovery is DNS — so
# no pod has any use for a token.
automountServiceAccountToken: false
{{- end }}

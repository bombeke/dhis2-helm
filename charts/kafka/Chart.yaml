annotations:
  category: Infrastructure
  licenses: Apache-2.0
  images: |
    - name: kafka
      image: docker.io/apache/kafka:4.3.1
    - name: kafka-ui
      image: docker.io/kafbat/kafka-ui:v1.5.0

apiVersion: v2
name: kafka
description: >-
  Apache Kafka in KRaft mode (no ZooKeeper) on the official apache/kafka image,
  with an optional read-only kafbat/kafka-ui.
type: application
keywords:
  - kafka
  - kraft
  - kafka-ui

# 0.2.0 replaces the Bitnami-based chart. Not an in-place upgrade: resource
# names, the data volume layout and the cluster id all change.
version: 0.2.0
appVersion: "4.3.1"

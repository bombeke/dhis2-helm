# -----------------------------------------------------------------------------
# Kafka: KRaft mode, no ZooKeeper, on the official apache/kafka image.
# -----------------------------------------------------------------------------
#
# Every node runs in KRaft "combined mode", acting as both broker and
# controller. With replicaCount: 1 the node is a single point of failure. That
# is fine for dev and small deployments. For HA, set replicaCount: 3 and raise
# the replication factors in `config` (see below).
#
# Where settings live:
#   ConfigMap  server.properties, mounted where the image's docker wrapper
#              reads it (/mnt/shared/config). It holds static broker settings.
#   Secret     the KRaft cluster id, and the kafka-ui login password.
#   Env        per-pod values only: node.id and advertised.listeners come
#              from the pod ordinal. `listeners` is also set here because the
#              image would otherwise derive it from advertised.listeners and
#              drop the controller listener.

nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local

commonLabels: {}
commonAnnotations: {}

image:
  # apache/kafka is the official Apache image (JVM build). apache/kafka-native
  # (GraalVM) starts faster but is documented as experimental, not for
  # production.
  registry: docker.io
  repository: apache/kafka
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Controllers form a static quorum across all replicas, so use an odd number
# (1 or 3). Changing this on a running cluster changes the voter set. That
# is a KRaft membership change, not a plain scale-out.
replicaCount: 1

# KRaft cluster id. Every broker's data directory is formatted with it and the
# broker refuses to start if it changes. It must be 22 chars of base64url
# (16 bytes), e.g. from `kafka-storage.sh random-uuid`.
#   - Set here: stored in a chart-managed Secret.
#   - existingSecret: read from your Secret (key below).
#   - Neither: generated on install and kept on upgrade by looking up the live
#     Secret. `helm template` (e.g. Argo CD) cannot do that lookup, so GitOps
#     installs MUST set clusterId or existingSecret.
clusterId: ""
existingSecret: ""
existingSecretClusterIdKey: cluster-id

# 1GB heap. The JVM would otherwise size its heap as a fraction of the node's
# RAM, which is far more than a broker needs.
heapOpts: "-Xms512m -Xmx1g"

# Root log level. Logs go to stdout only.
logLevel: INFO

listeners:
  # In-cluster clients connect here. The advertised address is the pod's
  # stable DNS name under the headless service.
  client:
    name: PLAINTEXT
    port: 9092
  # KRaft quorum. Never advertised to clients, and the NetworkPolicy only
  # lets other Kafka pods reach it.
  controller:
    name: CONTROLLER
    port: 9093

# Access from outside the cluster (the compose file's HOST listener).
#
# A client connects to the address the broker ADVERTISES after bootstrap, not
# the address it first dialled. Clients outside the cluster cannot resolve the
# in-cluster pod names, so they need their own advertised listener.
externalAccess:
  enabled: false
  name: EXTERNAL
  # Container port for the external listener.
  containerPort: 9092
  # Host that external clients dial. "localhost" works with:
  #   kubectl port-forward pod/<fullname>-0 9092:9092
  # For NodePort, use a node IP or DNS name.
  host: localhost
  # Broker N advertises host:(basePort + N). For NodePort the chart uses the
  # same number as the nodePort, so it must be in the node-port range
  # (e.g. 30092).
  basePort: 9092
  service:
    # ClusterIP (use with port-forward) or NodePort.
    type: ClusterIP
    annotations: {}

# Extra server.properties entries. Keys are Kafka property names. They are
# written after the chart-computed settings, so a key set here overrides them.
# Replication factors higher than replicaCount are rejected at render time.
config:
  # Replication factors are 1 for a single node. Kafka's default is 3, and on
  # a one-node cluster the internal topics then fail to create: the broker
  # starts but rejects every produce. With replicaCount: 3, set these to 3 and
  # the two min ISR settings to 2.
  offsets.topic.replication.factor: 1
  transaction.state.log.replication.factor: 1
  transaction.state.log.min.isr: 1
  share.coordinator.state.topic.replication.factor: 1
  default.replication.factor: 1
  min.insync.replicas: 1
  # Topic auto-creation is off, so a typo in a topic name fails loudly instead
  # of creating an empty topic that a consumer blocks on forever. Create
  # topics with `topics` below.
  auto.create.topics.enable: false
  num.partitions: 1
  # With no rebalance delay, consumers on a small cluster start without the
  # default 3s wait.
  group.initial.rebalance.delay.ms: 0

# Topics created by a post-install/post-upgrade Job with --if-not-exists.
# If partitions or replicationFactor is omitted, the broker defaults
# (num.partitions, default.replication.factor) apply.
# Topics that already exist are not changed: partitions and config apply only
# when a topic is first created.
topics: []
#  - name: domain-events
#    partitions: 3
#    replicationFactor: 1
#    config:
#      retention.ms: 604800000
#      cleanup.policy: delete

topicsJob:
  # Time to wait for the broker to answer before creating topics.
  waitTimeoutSeconds: 300
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}
  mountPath: /var/lib/kafka/data

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# The image runs as appuser (1000:1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The root filesystem is read-only. The image writes only to the config dir,
# the log dir and /tmp, and the chart mounts an emptyDir on each.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

# Probes run kafka-broker-api-versions.sh, which does a real API handshake. It
# passes only once the broker is actually serving. A TCP check on the client
# port passes earlier, while the node is still recovering its log.
startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 15
  # Up to 5 minutes for JVM start plus log recovery.
  failureThreshold: 30
readinessProbe:
  enabled: true
  periodSeconds: 15
  timeoutSeconds: 15
  failureThreshold: 3
# Liveness uses a TCP check. A JVM-launching exec every few seconds would
# cost more than the answer is worth.
livenessProbe:
  enabled: true
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

# Allows time for a controlled shutdown, in which partition leadership moves
# off this broker before it stops.
terminationGracePeriodSeconds: 120

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

pdb:
  create: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  # The controller port is always limited to Kafka pods. This setting is about
  # the client port:
  #   true  - any pod can connect.
  #   false - only Kafka pods, kafka-ui, the topics Job and pods labelled
  #           `<fullname>-client: "true"` (in any namespace) can connect,
  #           plus the peers listed in extraClientFrom.
  allowExternal: true
  # Extra NetworkPolicyPeer entries for the client port.
  extraClientFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: erp

# -----------------------------------------------------------------------------
# Kafka UI: view topics and messages.
# -----------------------------------------------------------------------------
# kafbat/kafka-ui is the maintained fork of provectuslabs/kafka-ui (archived in
# 2024). It is a viewer, not part of the data path: if it is down, nothing
# else breaks.
ui:
  enabled: true
  image:
    registry: docker.io
    repository: kafbat/kafka-ui
    tag: v1.5.0
    pullPolicy: IfNotPresent

  clusterName: bombeke-erp
  # Read-only mode. The UI can otherwise delete topics and produce messages,
  # which is risky and rarely needed. Use the topics Job or kafka-topics.sh.
  readOnly: true
  # Dynamic config lets users add or edit clusters from the browser, which
  # also lets them point the UI at any host:port the pod can reach. Off by
  # default. When on, it is stored in an emptyDir and lost on restart.
  dynamicConfig: false

  auth:
    # LOGIN_FORM auth with a single user. When disabled, anyone who can reach
    # the UI can browse every message.
    enabled: true
    username: admin
    # Leave empty to generate one (kept across upgrades by looking up the live
    # Secret). As with clusterId, set it or use existingSecret for GitOps.
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password

  # Extra Spring/kafka-ui settings merged into the application config.
  # Ref: https://ui.docs.kafbat.io/configuration/misc-configuration-properties
  extraConfig: {}

  javaOpts: "-XX:MaxRAMPercentage=75"

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    hostname: kafka-ui.local
    path: /
    # Set to use cert-manager TLS, e.g. le-staging or le-prod.
    certIssuer: ""
    annotations: {}

  podAnnotations: {}
  podLabels: {}

  # The image runs as kafkaui (100:101).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  networkPolicy:
    # Ingress to the UI port. Empty means from anywhere, which suits an
    # Ingress controller. Narrow it with NetworkPolicyPeer entries.
    from: []

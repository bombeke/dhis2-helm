{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka.uiName" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kafka.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka.ui.selectorLabels" . | nindent 8 }}
        # Lets the UI reach the client port when networkPolicy.allowExternal is false.
        {{ include "kafka.clientLabel" . }}: "true"
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ui/configmap.yaml") . | sha256sum }}
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kafka.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-ui
          image: {{ include "kafka.ui.image" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.ui.securityContext | nindent 12 }}
          env:
            - name: SPRING_CONFIG_ADDITIONAL-LOCATION
              value: /etc/kafka-ui/config.yml
            - name: JAVA_OPTS
              value: {{ .Values.ui.javaOpts | quote }}
            {{- if .Values.ui.auth.enabled }}
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafka.ui.secretName" . }}
                  key: {{ ternary .Values.ui.auth.existingSecretPasswordKey "password" (not (empty .Values.ui.auth.existingSecret)) }}
            {{- end }}
            {{- if .Values.ui.dynamicConfig }}
            - name: DYNAMIC_CONFIG_PATH
              value: /etc/kafkaui/dynamic_config.yaml
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The Spring Boot actuator is on the UI port and needs no login.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kafka-ui
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.ui.dynamicConfig }}
            - name: dynamic-config
              mountPath: /etc/kafkaui
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kafka.uiName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.ui.dynamicConfig }}
        - name: dynamic-config
          emptyDir:
            sizeLimit: 16Mi
        {{- end }}
{{- end }}

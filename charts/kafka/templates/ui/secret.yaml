{{- if and .Values.ui.enabled .Values.ui.auth.enabled (not .Values.ui.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.uiName" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  password: {{ include "kafka.ui.password" . | b64enc | quote }}
{{- end }}

{{- $fullname := include "kafka.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "kafka.headlessName" . }}
  # Start all pods together. Each node is a controller, and none becomes ready
  # until a quorum of voters is up. OrderedReady would wait forever on pod 0.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kafka.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Kubernetes injects env vars for every Service in the namespace. For a
      # Service named "kafka" that includes KAFKA_PORT, KAFKA_SERVICE_HOST and
      # so on, which the image would read as broker properties.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka
          image: {{ include "kafka.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Per-pod identity comes from the StatefulSet ordinal (<name>-N).
          # Use shell variables only here: the image turns any exported KAFKA_*
          # variable into a broker property.
          command: ["/bin/bash", "-ec"]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              export KAFKA_NODE_ID="${ordinal}"
              export KAFKA_ADVERTISED_LISTENERS="{{ .Values.listeners.client.name }}://${HOSTNAME}.{{ include "kafka.headlessName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:{{ .Values.listeners.client.port }}{{ if .Values.externalAccess.enabled }},{{ .Values.externalAccess.name }}://{{ .Values.externalAccess.host }}:$(( {{ .Values.externalAccess.basePort }} + ordinal )){{ end }}"
              exec /__cacert_entrypoint.sh /etc/kafka/docker/run
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafka.secretName" . }}
                  key: {{ ternary .Values.existingSecretClusterIdKey "cluster-id" (not (empty .Values.existingSecret)) }}
            # Set explicitly. If unset, the image derives listeners from
            # advertised.listeners, which never includes the controller.
            - name: KAFKA_LISTENERS
              value: {{ include "kafka.listeners" . | quote }}
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.heapOpts | quote }}
            - name: LOG_DIR
              value: /opt/kafka/logs
            # The default GC log can grow to 10 x 100MB, which would overrun
            # the log emptyDir. Keep it small instead.
            - name: KAFKA_GC_LOG_OPTS
              value: "-Xlog:gc*:file=/opt/kafka/logs/kafkaServer-gc.log:time,tags:filecount=2,filesize=20M"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.listeners.client.port }}
              protocol: TCP
            - name: controller
              containerPort: {{ .Values.listeners.controller.port }}
              protocol: TCP
            {{- if .Values.externalAccess.enabled }}
            - name: external
              containerPort: {{ .Values.externalAccess.containerPort }}
              protocol: TCP
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                {{- include "kafka.probeCommand" . | nindent 16 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                {{- include "kafka.probeCommand" . | nindent 16 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: server-config
              mountPath: /mnt/shared/config
              readOnly: true
            # The image writes its final config here on every start.
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: logs
              mountPath: /opt/kafka/logs
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: server-config
          configMap:
            name: {{ $fullname }}
        - name: kafka-config
          emptyDir:
            sizeLimit: 16Mi
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "kafka.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}

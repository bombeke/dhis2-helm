{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  podSelector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # KRaft quorum: only other Kafka nodes. The listener is PLAINTEXT, so any
    # pod that reached it could act as a controller.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kafka.selectorLabels" . | nindent 14 }}
      ports:
        - port: controller
          protocol: TCP
    # Client listener.
    - ports:
        - port: client
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector:
            matchLabels:
              {{- include "kafka.selectorLabels" . | nindent 14 }}
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{ include "kafka.clientLabel" . }}: "true"
        {{- with .Values.networkPolicy.extraClientFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    {{- if .Values.externalAccess.enabled }}
    # External listener: meant to be reached from outside the cluster.
    - ports:
        - port: external
          protocol: TCP
    {{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka.uiName" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      {{- include "kafka.ui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.ui.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}

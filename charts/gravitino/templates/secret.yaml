{{- if include "gravitino.ownSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gravitino.secretName" . }}
  labels:
    {{- include "gravitino.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
# Keys are generic here and mapped to property names by the Deployment's
# projected volume, so a Secret you bring yourself can use any key names.
stringData:
  {{- if and (include "gravitino.staticKeys" .) (not .Values.storage.credentials.existingSecret) }}
  s3-access-key-id: {{ .Values.storage.credentials.accessKey | quote }}
  s3-secret-access-key: {{ .Values.storage.credentials.secretKey | quote }}
  {{- end }}
  {{- if and (include "gravitino.postgresql" .) (not .Values.catalog.postgresql.existingSecret) }}
  jdbc-password: {{ .Values.catalog.postgresql.password | quote }}
  {{- end }}
  {{- range $key := (keys .Values.extraSecretConfig | sortAlpha) }}
  {{ $key }}: {{ get $.Values.extraSecretConfig $key | toString | quote }}
  {{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gravitino.serviceAccountName" . }}
  labels:
    {{- include "gravitino.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in this chart calls the Kubernetes API. IRSA and EKS Pod Identity
# inject their own token volume and do not need this.
automountServiceAccountToken: false
{{- end }}

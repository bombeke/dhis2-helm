apiVersion: v1
kind: Service
metadata:
  name: {{ include "gravitino.fullname" . }}
  labels:
    {{- include "gravitino.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.service.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ include "gravitino.scheme" . }}
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: {{ include "gravitino.scheme" . }}
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "gravitino.selectorLabels" . | nindent 4 }}

annotations:
  category: Database
  licenses: Apache-2.0
  images: |
    - name: gravitino-iceberg-rest
      image: docker.io/apache/gravitino-iceberg-rest:1.3.0

apiVersion: v2
name: gravitino
description: >-
  Apache Gravitino's Iceberg REST catalog, standalone — a durable JDBC catalog
  (SQLite on a volume, or PostgreSQL) over S3 or MinIO, with the config file
  assembled from a ConfigMap plus Secret files, a read-only root filesystem, and
  the JVM sized from the container's own limits.
type: application
keywords:
  - gravitino
  - iceberg
  - iceberg-rest
  - catalog
  - data-lake
  - s3
  - minio
home: https://gravitino.apache.org
sources:
  - https://github.com/apache/gravitino
version: 0.1.1
appVersion: "1.3.0"

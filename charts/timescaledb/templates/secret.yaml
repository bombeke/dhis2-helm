{{- if not .Values.auth.existingSecret }}
{{- $postgresPassword := include "timescaledb.password" (dict "ctx" $ "value" .Values.auth.password "key" "postgres-password") }}
{{- $appPassword := "" }}
{{- if .Values.auth.appUsername }}
{{- $appPassword = include "timescaledb.password" (dict "ctx" $ "value" .Values.auth.appPassword "key" "app-password") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "timescaledb.fullname" . }}
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
  annotations:
    # The superuser is created from this password by initdb on first boot. If
    # the Secret is deleted and regenerated while the PVC survives, the two no
    # longer agree — and `helm uninstall` deleting the Secret while a retained
    # PVC keeps the data is exactly how that happens. Keeping the Secret makes
    # the pair survive together.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  {{- if .Values.auth.appUsername }}
  app-password: {{ $appPassword | b64enc | quote }}
  # Ready-made connection URI for the application role, so a consuming chart
  # can mount one key instead of assembling a DSN from five values and getting
  # the percent-encoding wrong. urlquery encodes a space as '+', which is
  # correct for a query string and wrong for userinfo, hence the replace.
  uri: {{ printf "postgresql://%s:%s@%s:%d/%s?sslmode=%s"
            (urlquery .Values.auth.appUsername | replace "+" "%20")
            (urlquery $appPassword | replace "+" "%20")
            (include "timescaledb.serviceHost" .)
            (int .Values.service.port)
            .Values.auth.database
            (include "timescaledb.sslMode" .) | b64enc | quote }}
  {{- end }}
{{- end }}

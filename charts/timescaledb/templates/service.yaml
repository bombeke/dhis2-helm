apiVersion: v1
kind: Service
metadata:
  name: {{ include "timescaledb.fullname" . }}
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.service.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "timescaledb.selectorLabels" . | nindent 4 }}
---
# Governing service for the StatefulSet: gives the pod a stable DNS name of its
# own, independent of the Service above. Backup and migration tools want to
# address the instance rather than whatever the Service currently points at.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "timescaledb.headlessName" . }}
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  # A database that is starting up, or recovering, still has a DNS name worth
  # resolving — that is how you reach it to find out why.
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: {{ .Values.containerPort }}
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "timescaledb.selectorLabels" . | nindent 4 }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "timescaledb.serviceAccountName" . }}
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# PostgreSQL never calls the Kubernetes API. Without a projected token in the
# pod, a SQL-injection-to-shell chain ends at the container boundary instead of
# continuing into the API server.
automountServiceAccountToken: false
{{- end }}

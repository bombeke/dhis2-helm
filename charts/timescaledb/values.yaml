# -----------------------------------------------------------------------------
# PostgreSQL 18 + TimescaleDB + Toolkit + PostGIS — transactional truth.
# -----------------------------------------------------------------------------
#
# timescale/timescaledb-ha, NOT the stock postgres image. The `-ha` image is the
# only upstream artifact that carries PostgreSQL 18, the TimescaleDB extension,
# timescaledb_toolkit AND PostGIS 3 together. Building those on top of
# `postgres:18` by hand is the single most common way this setup fails: PostGIS
# and TimescaleDB both need a matching PGDG build against the exact server
# minor, and a mismatch surfaces as a runtime `could not load library` rather
# than a build failure.
#
# Where settings live:
#   ConfigMap  postgresql.conf, pg_hba.conf, pg_ident.conf and the bootstrap
#              SQL. Nothing that must stay secret goes here.
#   Secret     the superuser password, the application role's password and a
#              ready-made connection URI. They are mounted as FILES and read
#              through POSTGRES_PASSWORD_FILE, so no password is ever an
#              environment variable and none shows up in `kubectl describe pod`
#              or in the process environment inside the container.
#   Volume     /home/postgres/pgdata on a PersistentVolumeClaim. /tmp,
#              /var/run/postgresql (the unix socket) and /dev/shm are emptyDirs,
#              because the container's root filesystem is read-only.
#
# The server runs as a single node. The pod count is fixed at 1: a second pod
# would be a second, unrelated database, not a replica. The `-ha` image can run
# Patroni for real replication; this chart deliberately does not, because a
# half-configured Patroni is worse than an honest single node. Scale this
# vertically (resources + the tuning below), and put PgBouncer in front of it
# when connection count rather than CPU becomes the limit.

nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local

commonLabels: {}
commonAnnotations: {}

# Tag anatomy — `pg18.4-ts2.29.0`:
#   pg18.4   PostgreSQL 18.4. 18 is not incidental: `uuidv7()` is a built-in
#            server function only from 18 onward, so an ID scheme can generate
#            it server-side without an extension.
#   ts2.29.0 TimescaleDB 2.29.0.
# Deliberately NOT `-oss`: the OSS variant drops timescaledb_toolkit (which is
# TSL-licensed) and the compression/continuous-aggregate policies that any
# serious telemetry hypertable assumes. Deliberately not the bare `pg18` tag
# either — it moves, and a database that silently changes major version between
# two pod restarts will not start against its own data directory.
image:
  registry: docker.io
  repository: timescale/timescaledb-ha
  tag: "pg18.4-ts2.29.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 5432

auth:
  # The superuser (`POSTGRES_USER`) is created once, by initdb, on the first
  # start against an empty data directory. Later changes to the name here do
  # NOT rename it. The PASSWORD, however, is re-applied on every install and
  # upgrade by the bootstrap Job, so rotating it is: change the Secret (or
  # this value), `helm upgrade`, done.
  username: postgres
  # Leave empty to generate a random password on install. Upgrades keep it by
  # looking up the live Secret. `helm template` (e.g. Argo CD) cannot do that
  # lookup, so GitOps installs MUST set password or existingSecret.
  password: ""
  database: timescale

  # A non-superuser role for applications, owning `auth.database`. Nothing that
  # serves traffic should connect as the superuser. Leave username empty to
  # skip it. Its password is also re-applied on every upgrade.
  appUsername: ""
  appPassword: ""      # generated if empty, as for auth.password

  # Use your own Secret instead of the chart's. It must have the key
  # `postgres-password`, and `app-password` when auth.appUsername is set.
  existingSecret: ""

  # pg_hba.conf rules, most specific first. Empty means "use the chart's
  # default", which is scram-sha-256 everywhere and nothing else — no `trust`,
  # no `md5`, no `peer`. When tls.enabled is true the remote rules become
  # `hostssl`, so an unencrypted TCP connection is refused by the server rather
  # than merely discouraged.
  #
  # Consequence worth knowing before you hit it: `kubectl exec ... psql` needs
  # a password too, because even the local unix socket is scram. NOTES.txt
  # prints the exact command.
  hba: []
  #  - "hostssl all all 10.42.0.0/16 scram-sha-256"

# initdb runs ONCE, on the first start against an empty data directory.
initdb:
  # Postgres compares collation versions at startup, and an index built under a
  # different collation is silently wrong rather than loudly broken. Pinning the
  # locale keeps index ordering identical across nodes, across a `helm upgrade`
  # that moves the pod, and between your laptop and this cluster.
  args: "--locale=C.UTF-8 --encoding=UTF8"
  # Extra first-start scripts for /docker-entrypoint-initdb.d, keyed by file
  # name, run in file-name order. Use the 20- prefix upward: the image's own
  # scripts and this chart's are numbered below that.
  #
  # These run against a TEMPORARY server started by the image entrypoint, which
  # does NOT load this chart's postgresql.conf. Anything that needs
  # shared_preload_libraries — creating the timescaledb extension, for one —
  # will fail here. Put that in `bootstrap` instead, which runs against the real
  # server and is idempotent.
  scripts: {}
  #  20-schema.sql: |
  #    CREATE SCHEMA IF NOT EXISTS iot;

# Run after the server is up, on every install and upgrade, by a Helm hook Job.
# Everything here is idempotent, so it is also the repair path: delete a role by
# accident, re-run `helm upgrade`, get it back.
bootstrap:
  enabled: true
  # Extensions created in auth.database, in order, and then updated to the
  # version the image ships. `timescaledb` MUST stay first: it is the only one
  # whose `ALTER EXTENSION ... UPDATE` has to be the first statement of its
  # session, so the Job gives it a session of its own.
  extensions:
    - timescaledb
    - timescaledb_toolkit
    - postgis
    - pg_stat_statements
  # Extra SQL run last, as the superuser, against auth.database. It runs on
  # every upgrade, so write it idempotently.
  extraSql: ""
  #  CREATE SCHEMA IF NOT EXISTS iot AUTHORIZATION app;
  # PUBLIC keeps a CONNECT grant on every new database, which means any role
  # that exists at all can open a connection to this one. Revoking it makes the
  # grant list explicit.
  revokePublicConnect: true
  backoffLimit: 6
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# -----------------------------------------------------------------------------
# Server tuning.
# -----------------------------------------------------------------------------
#
# Rendered into postgresql.conf verbatim, one `key = 'value'` per entry. Helm
# merges this map key by key, so overriding one setting keeps the rest of the
# defaults below.
#
# A handful of settings are NOT here because the chart computes them and they
# must match the pod's filesystem: data_directory, hba_file, ident_file,
# listen_addresses, port, unix_socket_directories, shared_preload_libraries,
# password_encryption and the ssl_* family. Setting them here has no effect.
#
# These defaults are sized for the `resources` block further down (4Gi limit).
# If you change one, change the other: shared_buffers above the memory limit is
# an OOMKill at startup, not a warning.
config:
  # --- Memory.
  #
  # shared_buffers: Postgres' own page cache. The upstream default of 128MB is
  # sized for a 1GB VM. The production rule of thumb is 25% of available RAM,
  # which against a 4Gi limit is 1GB. Going much past 25% stops helping,
  # because the rest of the machine's RAM is doing useful work as OS page cache.
  shared_buffers: 1GB
  # work_mem: per sort/hash NODE, not per query and not per connection. A query
  # with three sorts and two hash joins can use five times this, and every
  # parallel worker gets its own allowance. The 4MB default spills routine
  # analytical joins to disk; 32MB does not. The bound to keep in your head is
  # roughly max_connections * nodes * work_mem, so raising max_connections and
  # work_mem together is how people run a server out of memory.
  work_mem: 32MB
  # maintenance_work_mem: used by CREATE INDEX, VACUUM and ALTER TABLE ADD
  # FOREIGN KEY. TimescaleDB's compression and continuous-aggregate jobs are
  # maintenance work too, so this is not only a migration-time setting.
  maintenance_work_mem: 512MB
  # effective_cache_size: a PLANNER HINT, not an allocation. It tells the
  # planner how much OS page cache it can expect to find its data in, which
  # decides index scan vs seq scan. Roughly 50-75% of the memory limit.
  effective_cache_size: 3GB
  # max_connections: each backend is a process that reserves memory even while
  # idle, so this is a memory setting as much as a concurrency one. 200 is
  # generous for a handful of pooled application replicas. If you need
  # thousands, the answer is PgBouncer in front, not a bigger number here.
  max_connections: 200

  # --- Storage.
  #
  # random_page_cost: the default 4.0 encodes spinning rust. Every storage class
  # worth attaching to this is SSD or NVMe, where a random read costs nearly the
  # same as a sequential one. 1.1 stops the planner from avoiding index scans it
  # should be using.
  random_page_cost: 1.1
  # effective_io_concurrency: how many concurrent I/Os the planner assumes it
  # can issue for a bitmap heap scan. In 18 this also feeds the AIO machinery.
  # The default is 16 as of 18; 32 suits NVMe.
  effective_io_concurrency: 32

  # --- PG18 asynchronous I/O.
  #
  # io_method is new in PostgreSQL 18. Values: `sync` (the pre-18 behaviour),
  # `worker` (the 18 default — a pool of io workers issues readahead), and
  # `io_uring` (Linux only, requires the server to be built against liburing).
  #
  # `worker` is the value that is correct on EVERY node. `io_uring` is
  # measurably better for long analytical scans, but it is not portable: it
  # fails at startup if the node's kernel has `kernel.io_uring_disabled=1` or
  # `=2`, which is a common hardening default and the default in several
  # container runtimes and managed node images. A bad value here means the
  # database does not start at all — so the portable value is the default and
  # opting into io_uring is an explicit, per-cluster decision.
  io_method: worker
  # io_workers only applies when io_method=worker; it is ignored otherwise.
  # This is a count of background processes doing readahead, and oversizing it
  # just adds context switches.
  io_workers: 3

  # --- Write-ahead log and checkpoints.
  #
  # The default max_wal_size of 1GB forces frequent checkpoints under a write
  # load, and each checkpoint is an I/O spike that shows up as latency in
  # unrelated queries. A larger WAL trades disk (see persistence.size) for
  # flatter latency. checkpoint_completion_target spreads the flush across 90%
  # of the interval instead of dumping it.
  max_wal_size: 4GB
  min_wal_size: 1GB
  checkpoint_completion_target: "0.9"
  # WAL compression pays for itself on the wide, repetitive rows that telemetry
  # tables are made of. zstd gives the best ratio per CPU cycle of the three
  # available methods (pglz, lz4, zstd).
  wal_compression: zstd
  # Log checkpoints. This is the cheapest way to find out that your WAL settings
  # are wrong — a "checkpoints are occurring too frequently" line names the
  # problem directly.
  log_checkpoints: "on"

  # --- Parallelism and TimescaleDB background workers.
  #
  # These four are a system and must be set together. TimescaleDB's policies
  # (compression, retention, continuous-aggregate refresh) each occupy a
  # background worker, and those come out of max_worker_processes — the SAME
  # pool as parallel query workers. Under-size max_worker_processes and the
  # symptom is not an error: it is policies that silently stop running while
  # parallel queries quietly go serial.
  #
  # The rule: max_worker_processes >= timescaledb.max_background_workers +
  #                                   max_parallel_workers + 1.
  max_worker_processes: 32
  max_parallel_workers: 8
  max_parallel_workers_per_gather: 4
  "timescaledb.max_background_workers": 16

  # --- TimescaleDB.
  #
  # No phone-home.
  "timescaledb.telemetry_level": "off"

  # jit: PostgreSQL's LLVM expression compiler. It helps a long analytical scan
  # and hurts everything else, because the compile cost is paid per query
  # against a cost ESTIMATE that hypertables routinely get wrong — a chunk-
  # excluded query looks expensive at plan time and cheap at run time, so it
  # gets JIT-compiled for nothing. Timescale's own recommendation is off.
  jit: "off"

  # --- Observability.
  #
  # pg_stat_statements is the only way to count EXECUTIONS per normalised
  # statement, which is how an N+1 is found: a page that issues one query per
  # row shows up as a single statement with a call count proportional to the
  # page size. Application logs cannot prove its absence and EXPLAIN cannot see
  # across statements. It is a fixed-size ring in shared memory, so it costs the
  # same whether or not anything ever reads it. (The library itself is loaded
  # via sharedPreloadLibraries below.)
  #
  # `all` tracks the nested statements a PL/pgSQL function issues, not just the
  # top-level call. Without it, work done inside a stored procedure is invisible.
  "pg_stat_statements.track": all
  # `all` for log_min_duration_statement would be deafening; 200ms surfaces the
  # queries worth looking at.
  log_min_duration_statement: 200ms
  # %q splits the prefix: everything after it is printed only for session
  # processes, so background worker lines stay clean.
  log_line_prefix: "%m [%p] %q%u@%d "
  # A lock wait long enough to trip deadlock_timeout is worth a line. This is
  # how you find the migration that took an ACCESS EXCLUSIVE lock at 09:00.
  log_lock_waits: "on"
  # Temp files mean a query outgrew work_mem. Logging the ones over 64MB finds
  # the query to fix without logging every small sort.
  log_temp_files: 64MB
  # UTC in the database, always. Local time zones belong in the presentation
  # layer, and a server that logs in local time makes correlating with any other
  # system an exercise in arithmetic.
  timezone: UTC
  log_timezone: UTC

# Libraries loaded into every backend at startup rather than merely installed.
# TimescaleDB hooks the planner and REQUIRES this: `CREATE EXTENSION timescaledb`
# on its own leaves it inert. pg_stat_statements allocates its shared-memory
# ring here too. Both need a restart to change, which is why they are a list
# separate from `config`.
sharedPreloadLibraries:
  - timescaledb
  - pg_stat_statements

# -----------------------------------------------------------------------------
# TLS.
# -----------------------------------------------------------------------------
#
# When enabled, the chart's default pg_hba turns its remote rules into
# `hostssl`, so plaintext TCP is refused rather than merely unused.
#
# The Secret must carry tls.crt and tls.key, which is exactly the shape
# cert-manager writes — point a Certificate at this and set existingSecret to
# its secretName. The key is mounted 0440 root:fsGroup, which is the one
# permission set that satisfies Postgres' own check on the private key file
# (owned by root, no world access, readable by the server's group).
tls:
  enabled: false
  existingSecret: ""
  certKey: tls.crt
  keyKey: tls.key
  # A CA here switches on client-certificate verification: set clientAuth to
  # `verify-ca` or `verify-full` and pg_hba rules gain the matching clientcert
  # option. Leave empty for server-side TLS only. Note what each one checks:
  # `verify-ca` only asks that the client cert was signed by caKey, while
  # `verify-full` additionally requires its CN to equal the database user the
  # client is logging in as — so a client cert per role, not one shared cert.
  caKey: ca.crt
  clientAuth: ""
  # Required when clientAuth is set, because the chart's own bootstrap Job and
  # helm test connect over TCP like any other client and would be turned away
  # without a certificate of their own. A Secret with tls.crt, tls.key and
  # ca.crt, signed by the same CA — a second cert-manager Certificate does it.
  #
  # libpq, unlike the server, refuses a private key that is group-readable at
  # all, and a Kubernetes Secret mount cannot produce a 0600 file owned by the
  # reader. The scripts copy the key to an emptyDir and chmod it there.
  clientSecret: ""
  # TLS 1.2 is the floor. Nothing that can speak to PostgreSQL 18 is stuck below
  # it, and 1.0/1.1 have no defensible use here.
  minProtocolVersion: TLSv1.2

# Extra container env vars, as a list of EnvVar objects. Do not put passwords
# here — use auth.existingSecret, which is mounted as files.
extraEnv: []

service:
  # ClusterIP for in-cluster clients. NodePort or LoadBalancer exposes the
  # database outside the cluster, which is a decision, not a convenience: set
  # tls.enabled and tighten auth.hba first.
  type: ClusterIP
  port: 5432
  nodePort: ""
  annotations: {}

persistence:
  enabled: true
  # Bind to a PVC you created yourself, e.g. one backed by a local
  # PersistentVolume on an NVMe node. If empty, the StatefulSet creates one.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  # Sized for data + indexes + max_wal_size + room for a VACUUM FULL or an index
  # rebuild, which needs space for a second copy of the largest table. Most
  # storage classes allow expansion; none of them allow shrinking.
  size: 50Gi
  annotations: {}

# PostgreSQL's parallel workers exchange tuples through POSIX shared memory in
# /dev/shm. Kubernetes gives a container 64MB there by default, and a parallel
# query that outgrows it fails at RUN time with "could not resize shared memory
# segment" — after planning, after the user waited. This mounts a real one.
#
# It is memory-backed, so it counts against the container's memory limit: the
# limit below must cover shared_buffers + this + the backends.
shmVolume:
  enabled: true
  sizeLimit: 1Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# The image runs as postgres (1000:1000). fsGroup is what makes the PVC, the
# socket directory and the TLS key readable to it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The root filesystem is read-only. Postgres writes to the data volume, to
# /var/run/postgresql (the unix socket and postmaster lock) and to /tmp; the
# chart mounts a volume on each. If the image turns out to need another writable
# path, add it through extraVolumes/extraVolumeMounts rather than switching this
# off wholesale.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Always set a memory LIMIT: it is the number every memory setting above is
# sized against. Deliberately no CPU limit — CFS throttling on a database turns
# a busy moment into tail latency across every query at once, and the request
# already guarantees the floor.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 4Gi

# The probes run pg_isready over the local unix socket. It does not
# authenticate, so the probes never need a password; it returns success as soon
# as the postmaster accepts connections.
startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  # Up to 10 minutes. First boot runs initdb plus the init scripts, and a crash
  # recovery on a large max_wal_size can take minutes before the server accepts
  # a single connection. A startup probe that gives up here is a crash loop that
  # never lets recovery finish.
  failureThreshold: 60
readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  enabled: true
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

# SIGTERM to postgres is a SMART shutdown: it waits for every client to
# disconnect on its own, which under a connection pool means forever, which
# means SIGKILL at the end of the grace period and crash recovery on the next
# start. The preStop hook runs `pg_ctl -m fast` instead: refuse new connections,
# roll back the open ones, checkpoint, exit clean.
terminationGracePeriodSeconds: 120

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# A single-replica StatefulSet and a PDB interact badly: minAvailable 1 blocks
# every voluntary node drain forever, because there is no second pod to take
# over. Left off on purpose. Turn it on only if a brief outage during a node
# drain is worse for you than a drain that never completes.
podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: 1

extraVolumes: []
extraVolumeMounts: []

networkPolicy:
  enabled: true
  #   true  - any pod can reach the database.
  #   false - only pods labelled `<fullname>-client: "true"` (in any
  #           namespace), plus the peers in extraFrom, can reach it. The
  #           bootstrap Job and the helm test pod carry that label already.
  allowExternal: true
  extraFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: dhis2

  # A database initiates nothing. Restricting egress to DNS means a compromised
  # backend cannot open a socket back out of the cluster — no exfiltration path,
  # no COPY TO PROGRAM calling home. Turn this on unless you use an extension
  # that dials out (postgres_fdw, dblink, an archive_command that ships WAL
  # somewhere), in which case add that destination to extraEgress.
  restrictEgress: false
  extraEgress: []
  #  - to:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: minio
  #    ports:
  #      - port: 9000
  #        protocol: TCP

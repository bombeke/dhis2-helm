apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  mongod.conf: |
    {{- include "mongodb.config" . | nindent 4 }}
  # Global mongosh config. The probes start mongosh every few seconds, and
  # each run would otherwise write a log file.
  mongosh.conf: |
    mongosh:
      disableLogging: true
      enableTelemetry: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongodb.fullname" . }}-initdb
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.auth.username }}
  # The password is read from the mounted Secret, so it never appears in
  # this ConfigMap.
  00-app-user.js: |
    const password = require("fs").readFileSync("/etc/mongodb/secrets/password", "utf8");
    db.getSiblingDB({{ .Values.auth.database | toJson }}).createUser({
      user: {{ .Values.auth.username | toJson }},
      pwd: password,
      roles: [{ role: "readWrite", db: {{ .Values.auth.database | toJson }} }],
    });
  {{- end }}
  {{- range $name, $script := .Values.initScripts }}
  {{ $name }}: |
    {{- $script | nindent 4 }}
  {{- end }}

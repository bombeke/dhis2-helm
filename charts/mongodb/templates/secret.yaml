{{- if not .Values.auth.existingSecret }}
{{- $password := "" }}
{{- if .Values.auth.username }}
{{- $password = include "mongodb.password" (dict "ctx" $ "value" .Values.auth.password "key" "password") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  annotations:
    # The users are created from these passwords on first start only. If the
    # Secret is deleted and regenerated, it no longer matches the database.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  root-password: {{ include "mongodb.password" (dict "ctx" $ "value" .Values.auth.rootPassword "key" "root-password") | b64enc | quote }}
  {{- if .Values.auth.username }}
  password: {{ $password | b64enc | quote }}
  # Connection string for the application user.
  uri: {{ printf "mongodb://%s:%s@%s/%s?authSource=%s" (urlquery .Values.auth.username | replace "+" "%20") (urlquery $password | replace "+" "%20") (include "mongodb.host" .) .Values.auth.database .Values.auth.database | b64enc | quote }}
  {{- end }}
{{- end }}
